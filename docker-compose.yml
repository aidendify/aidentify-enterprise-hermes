# Enterprise-Hermes appliance — one-command Docker stack
#   ./enthermes up   → builds + starts, then GET /health
# Public API + admin control plane exposed on ${PORT:-8081}
services:
  core:
    build: .
    container_name: enterprise-hermes
    environment:
      # Values resolve from the host .env if present, else safe defaults.
      # LLM_API_KEY left empty => governance fully works; /agents/run returns 503
      # until the host supplies a key (the safe enterprise default: zero egress).
      LLM_BASE_URL: "${LLM_BASE_URL:-https://openrouter.ai/api/v1}"
      LLM_MODEL: "${LLM_MODEL:-deepseek/deepseek-v4-flash-0731}"
      LLM_API_KEY: "${LLM_API_KEY:-}"
      ALLOW_EGRESS: "${ALLOW_EGRESS:-false}"
      PORT: "${PORT:-8081}"
      EHERMES_WORKSPACE: /app/_data/workspace
    volumes:
      - ./_data:/app/_data
    ports:
      - "8081:8080"        # explicit host port (Hostinger runner needs a literal mapping)
    command: uvicorn api.main:app --host 0.0.0.0 --port 8080
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/health',timeout=3).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s