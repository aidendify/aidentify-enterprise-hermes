[project]
name = "enterprise-hermes"
version = "1.0.0"
description = "Governed self-hosted Hermes agent appliance for enterprises"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.uv]
package = false
environments = []

[tool.pytest.ini_options]
testpaths = ["tests"]